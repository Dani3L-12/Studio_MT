<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#070B0A"/>
  <circle cx="600" cy="315" r="400" fill="#00E5C3" fill-opacity="0.08" filter="blur(80px)"/>
  <circle cx="900" cy="150" r="300" fill="#39FF14" fill-opacity="0.08" filter="blur(80px)"/>
  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" stroke="rgba(0, 229, 195, 0.2)" stroke-width="2" fill="rgba(7, 11, 10, 0.6)"/>
  <!-- Logo Monogram -->
  <rect x="120" y="140" width="100" height="100" rx="20" fill="url(#paint0_linear)" stroke="rgba(57, 255, 20, 0.4)" stroke-width="2"/>
  <text x="170" y="205" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="50" fill="#FFFFFF" text-anchor="middle">SM</text>
  
  <!-- Text content -->
  <text x="120" y="320" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="64" fill="#FFFFFF">Studio MG</text>
  <text x="120" y="400" font-family="'Inter', sans-serif" font-weight="600" font-size="32" fill="#00E5C3">Páginas web rápidas y modernas para negocios en Cusco</text>
  <text x="120" y="460" font-family="'Inter', sans-serif" font-weight="400" font-size="22" fill="#9CA3AF">Restaurantes, cafés y emprendimientos • Entrega en pocos días</text>

  <defs>
    <linearGradient id="paint0_linear" x1="120" y1="140" x2="220" y2="240" gradientUnits="userSpaceOnUse">
